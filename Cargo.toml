[package]
name = "nyra"
version = "0.6.0"
edition = "2021"
description = "A compact, strictly-typed programming language designed to be written by AI agents. Compiles to C, JavaScript, Python, TypeScript, Rust and Go."
license = "MIT"
repository = "https://github.com/SpAkXD/nyra"
readme = "README.md"
keywords = ["language", "compiler", "transpiler", "ai", "llm"]
categories = ["compilers", "development-tools"]

[[bin]]
name = "nyra"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
